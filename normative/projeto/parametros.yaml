# Parâmetros de DIMENSIONAMENTO do projeto de segurança contra incêndio e pânico (design-params/1.0).
#
# RASCUNHO redigido pelo assistente a partir do texto ingerido das NTs (normative/fontes). Sem
# homologação: nenhum resultado tem valor normativo. Cada parâmetro traz a citação (documento,
# item, termos) que é CONFERIDA no texto ao carregar; parâmetro cuja citação não confere não é
# usado (o cálculo que depende dele é recusado). "linha" confere os termos na MESMA linha de tabela.
# "texto_em" diz em que item do texto ingerido o trecho caiu quando a extração do PDF deslocou a
# tabela ou o parágrafo (a citação continua sendo a do "item"; a página é a do trecho encontrado).
# "imagem" registra conferência visual na página (células mescladas que o texto não reproduz).
schema_version: design-params/1.0
parametros:

  # --- NT 2-01 — extintores ---------------------------------------------------------------------
  ext.area_max_m2:
    titulo: Área máxima protegida por uma unidade extintora
    valor: {PEQUENO: 250, MEDIO: 150, GRANDE: 100}
    unidade: m²
    fonte: {document: NT 2-01, item: Tabela 3,
            quote: ["Área máxima protegida por 01 (uma) unidade extintora", "250 m²", "150 m²", "100 m²"]}
  ext.distancia_max_m:
    titulo: Distância máxima a percorrer até o extintor
    valor: {PEQUENO: 20, MEDIO: 15, GRANDE: 10}
    unidade: m
    fonte: {document: NT 2-01, item: Tabela 3,
            quote: ["Distância máxima percorrida", "20 m", "15 m", "10 m"]}
  ext.minimo_por_edificacao:
    titulo: Mínimo de extintores (um classe A e um classes B e C, ou dois ABC)
    valor: 2
    unidade: un
    fonte: {document: NT 2-01, item: "5.2.5",
            quote: ["no mínimo, 02 (dois) extintores de incêndio", "02 (dois) extintores iguais de pó ABC"]}
  ext.unico_abc_area_m2:
    titulo: Área abaixo da qual se admite uma única unidade de pó ABC (risco pequeno)
    valor: 50
    unidade: m²
    fonte: {document: NT 2-01, item: "5.2.4",
            quote: ["uma única unidade extintora de pó ABC", "risco pequeno", "inferior a 50 m²"]}
  ext.capacidade_minima_portatil:
    titulo: Capacidade extintora mínima — extintores portáteis
    valor: {AGUA: "2-A", ESPUMA: "2-A: 10-B", CO2: "5-B: C", PQS_BC: "20-B: C", PQS_ABC: "2-A: 20-B: C"}
    fonte: {document: NT 2-01, item: Tabela 1,
            quote: ["2-A: 10-B", "5-B: C", "20-B: C", "2-A: 20-B: C"]}
  ext.capacidade_minima_sobre_rodas:
    titulo: Capacidade extintora mínima — extintores sobre rodas
    valor: {AGUA: "10-A", ESPUMA: "6-A: 40-B", CO2: "10-B: C", PQS_BC: "80-B: C", PQS_ABC: "6-A: 80-B: C"}
    fonte: {document: NT 2-01, item: Tabela 2,
            quote: ["10-A", "6-A: 40-B", "10-B: C", "80-B: C", "6-A: 80-B: C"]}
  ext.risco_grande_classe_a:
    titulo: Capacidade mínima classe A no risco grande
    valor: "4-A"
    fonte: {document: NT 2-01, item: "6.1.1.2", texto_em: Tabela 3,
            quote: ["Para o risco grande, a unidade extintora para", "capacidade extintora mínima", "4A"]}
  ext.sobre_rodas_risco_grande:
    titulo: Extintor sobre rodas obrigatório no risco grande (protege até metade da área)
    valor: {obrigatorio_em: GRANDE, fracao_maxima_da_area: 0.5}
    fonte: {document: NT 2-01, item: "5.3",
            quote: ["obrigatória nas edificações de risco grande", "metade da área total"]}
  ext.instalacao_especial_distancia_m:
    titulo: Distância máxima do extintor à instalação especial (casa de máquinas, bombas, força…)
    valor: 5
    unidade: m
    fonte: {document: NT 2-01, item: "6.4", quote: ["não distar mais do que 5 m"]}
  ext.altura_alca_max_m:
    titulo: Altura máxima da alça de manuseio
    valor: 1.6
    unidade: m
    fonte: {document: NT 2-01, item: "5.2.1", quote: ["não deve exceder 1,60 m do piso acabado"]}

