  spk.mangote_diametro_min_mm:
    titulo: Diâmetro interno mínimo do mangote flexível de ligação do bico
    valor: 25
    unidade: mm
    fonte: {document: NT 2-03 P1, item: "5.3.3", pagina: 5,
            quote: ["mangotes flexíveis", "diâmetro interno mínimo de 25 mm"]}
  spk.vga:
