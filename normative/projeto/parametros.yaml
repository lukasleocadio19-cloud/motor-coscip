  spk.rti_reservatorio_unico:
    titulo: RTI acima de 70 % do reservatório único — exige o cálculo do abastecimento predial
    valor: 70
    unidade: "%"
    fonte: {document: NT 2-03 P1, item: "5.4.4", pagina: 5,
            quote: ["RTI for superior a 70% do volume deste reservatório"]}
  spk.abrangencia:
    titulo: O sistema abrange toda a área da edificação (exceções à parte)
    valor: true
    fonte: {document: NT 2-03 P1, item: "5.2.1", pagina: 4,
            quote: ["este sistema deverá abranger toda a área da edificação"]}
  spk.dispensa_sanitarios:
    titulo: Dispensa em banheiros, lavatórios e lavabos (vestiários não são dispensados); subestações, salas de medidores e de PC de energia até 20 m²
    valor: {area_max_eletrica_m2: 20}
    unidade: m²
    fonte: {document: NT 2-03 P1, item: "5.2.3", pagina: 4,
            quote: ["dispensada em banheiros, lavatórios e lavabos", "vestiários", "subestações, salas de medidores e de PC de energia elétrica", "área interna máxima de 20 m²"]}
  spk.dispensa_camara_fria:
