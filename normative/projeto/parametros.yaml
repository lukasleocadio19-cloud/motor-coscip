    valor: {temperatura_max_c: 5, area_max_m2: 12}
    fonte: {document: NT 2-03 P1, item: "5.2.3.1", pagina: 4,
            quote: ["câmaras frigoríficas que operem com temperaturas inferiores a 5º C", "área interna máxima de 12 m²"]}
  spk.dispensa_varanda:
    titulo: Varandas permanentemente abertas são isentas (acabamento incombustível e Termo de Compromisso)
    valor: true
    fonte: {document: NT 2-03 P1, item: "5.2.4", pagina: 4,
            quote: ["isentos do sistema de chuveiros automáticos as varandas permanentemente abertas"]}
  spk.detector_alternativa:
    titulo: Detectores no lugar dos sprinklers (a critério do projetista) em ambientes especiais, com compartimentação de 30 min de TRRF
    valor: {subestacao_area_max_m2: 40, cpd_area_max_m2: 20, trrf_min: 30}
    fonte: {document: NT 2-03 P1, item: "5.2.5", pagina: 4,
            quote: ["poderá ser substituída pela instalação de detectores de incêndio", "centros de processamento de dados (CPD) com área máxima de 20 m²", "30 min de TRRF"]}
  spk.entreforro:
