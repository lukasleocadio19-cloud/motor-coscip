#
# As tabelas são lidas direto do texto ingerido e passam por conferência estrutural a cada carga
# (packages/design/coscip_design/anexo_iii.py). Isso não pega célula deslocada de coluna na
# extração do PDF; por isso cada tabela também é conferida no PDF oficial, célula a célula, e
# registrada aqui com o resumo ("digest") da leitura conferida.
#
# O registro só vale enquanto (a) o texto em uso vier do PDF de mesmo SHA-256 e (b) a leitura
# der o mesmo digest. Mudou o texto ou o leitor: a tabela volta a "sem conferência visual" até
# alguém conferir de novo e rodar scripts/projeto/registrar_conferencia_anexo_iii.py.
#
# "colunas" traz os cabeçalhos das tabelas do grupo M que têm células mescladas no PDF (a
# leitura do texto não os reconstrói) e a observação presa ao cabeçalho da coluna (Tabela 28).
