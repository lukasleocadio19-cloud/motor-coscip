wording:
  title: Nenhum acionador manual foi localizado no pavimento
  explanation: >-
    O sistema de alarme é exigido e a NT 2-07 pede acionador manual em cada pavimento,
    mas a extração não reconheceu acionador neste. Mezaninos e jiraus podem ser
    dispensados quando atendidos pelo acionador do pavimento de referência.
  required_action: >-
    Conferir na planta e, se houver acionador, identificar o símbolo ou a camada;
    se não houver, prever o acionador no pavimento.
