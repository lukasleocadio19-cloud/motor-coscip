# RASCUNHO. Projeto sem leiaute definido (NT 2-08 5.3.3.3): distância DIRETA até a saída,
# comparada ao limite do Anexo C reduzido em 30%. A consulta à tabela já aplica a redução;
# se o analista informar o limite, vale o valor dele.
# v2: a decisão do analista (25/09/2026) virou interpretação registrada (F4.1).
schema_version: checks/1.0
id: SAI-CAD-003
version: 2
title: Distância direta até a saída (projeto sem leiaute)
system: SAIDAS
type: CAD_DISTANCE
scope: FLOOR
severity: MAJOR
publication_state: DRAFT
production_eligible: false
group_key: saidas/distancia
depends_on: [SAI-CAD-001]
applies_when:
  all:
    - {fact: context.unifamiliar, operator: equals, value: false}
    - {fact: context.layout_defined, operator: equals, value: false}
    - {fact: context.occupancy, operator: not_equals, value: A-2}
    - {fact: context.occupancy, operator: not_equals, value: A-5}
    - {fact: context.occupancy, operator: not_equals, value: A-6}
question:
  kind: maximum_value
  field: exit_direct_distance_m
  required_fact: context.effective_exit_max_distance_m
  unit: m
  accepted_evidence: [CAD]
  # Linha reta não contorna paredes: dispensa a porta de paredes, não a de pavimento.
  quality_gates: [context.exits_confirmed, quality.region_confirmed]
normative_basis:
  - document: NT 2-08
    edition: 1ª edição - 2019; Portaria 1.317/2025
    item: "5.3.3.3"
    quote: ["devem ser consideradas as distâncias diretas comparadas aos limites do Anexo C",
            "reduzidas em 30%"]
  - document: NT 2-08
    edition: 1ª edição - 2019; Portaria 1.317/2025
    item: Anexo C
    quote: ["DISTÂNCIAS MÁXIMAS A SEREM PERCORRIDAS"]
interpretation:
  scope: DISTANCIA_DIRETA_REDUCAO_EM_30
  basis:
    - document: NT 2-08
      edition: 1ª edição - 2019; Portaria 1.317/2025
      item: "5.3.3.3"
      quote: ["distâncias diretas comparadas aos limites do Anexo C, reduzidas em 30%"]
    - document: NT 2-08
      edition: 1ª edição - 2019; Portaria 1.317/2025
      item: Anexo C
      quote: ["reduzidas a 30%"]
  decision: >-
    sem leiaute definido prevalece o item 5.3.3.3: limite do Anexo C reduzido EM 30% (×0,7) e
    distância direta, e não a observação C do Anexo C ("reduzidas a 30%").
  decided_by: analista
  decided_on: "2026-09-25"
wording:
  title: Distância direta até a saída acima do limite reduzido
  explanation: >-
    Sem leiaute definido, a NT 2-08 (5.3.3.3) manda comparar a distância em linha reta do
    ponto mais distante até a saída com o limite do Anexo C reduzido em 30%. A maior
    distância direta medida no pavimento ultrapassa esse limite.
  required_action: >-
    Apresentar o leiaute definido em planta baixa ou rever a posição e o número de saídas
    de modo que nenhum ponto fique além do limite reduzido.
