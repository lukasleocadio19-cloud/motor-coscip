wording:
  title: Distância a percorrer até o extintor acima do limite (risco Grande)
  explanation: >-
    A maior distância a percorrer medida no pavimento ultrapassa os 10 m previstos
    para o risco Grande.
  required_action: >-
    Reposicionar ou acrescentar unidade extintora de modo que nenhum ponto do
    pavimento ultrapasse 10 m de percurso.
