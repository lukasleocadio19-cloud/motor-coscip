# RASCUNHO. Distância máxima a percorrer até a unidade extintora — risco Médio.
# Um check por risco: o limite fica literal e conferível, sem tabela embutida no motor.
# v2 (fase 3): pavimento confirmado e área toda alcançada pelo percurso como portas de qualidade.
schema_version: checks/1.0
id: EXT-CAD-003-MEDIO
version: 4
title: Distância a percorrer até o extintor (risco Médio)
system: EXTINTORES
type: CAD_DISTANCE
scope: FLOOR
severity: MAJOR
publication_state: DRAFT
production_eligible: false
group_key: extintores/distancia
depends_on: [EXT-CAD-001]
applies_when:
  all:
    - {fact: context.risk_class, operator: equals, value: MEDIO}
    - {fact: context.unifamiliar, operator: equals, value: false}
question:
  kind: maximum_value
  field: extinguisher_walk_distance_m
  required_value: 15
  unit: m
  accepted_evidence: [CAD, CALCULATION]  # medida calculada sobre a geometria do CAD
  quality_gate: quality.walls_detected
  quality_gates: [quality.region_confirmed, quality.extinguisher.complete, quality.recognition.complete,
                  quality.geometry.consistent]  # F7.2: vetorial × FMM
normative_basis:
  - document: NT 2-01
    edition: 2ª edição - 2020
    item: Tabela 3
    quote: ["Distância máxima percorrida", "15 m", "Médio"]
wording:
  title: Distância a percorrer até o extintor acima do limite (risco Médio)
  explanation: >-
    A maior distância a percorrer medida no pavimento ultrapassa os 15 m previstos
    para o risco Médio.
  required_action: >-
    Reposicionar ou acrescentar unidade extintora de modo que nenhum ponto do
    pavimento ultrapasse 15 m de percurso.
