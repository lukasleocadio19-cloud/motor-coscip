notas:
- A coluna Símbolo traz o desenho do sinal (só na imagem da página); a célula fica em branco na tabela.
  Célula de forma e cor mesclada entre linhas repete-se na publicação.
- Na S-17 a página mostra um glifo que não foi renderizado (□) entre "1º + SS" e "1º SS", provavelmente
  uma seta; a camada de texto o omite.
- 'Mensagens dos sinais: S-17 "20º" e "1ºSS"; S-18 "APERTE E EMPURRE"; S-19 "PORTA CORTA-FOGO É OBRIGATÓRIO
  MANTER FECHADA"; S-20 "PORTA CORTA-FOGO".'
- 'Fonte indicada na página: ABNT NBR 16820.'
inconsistencias_da_fonte:
- Código "S16-E" sem o hífen dos demais ("S-16-D").
- 'S-17: "Altura de instalação:" sem valor, seguida de "Nível: superior".'
