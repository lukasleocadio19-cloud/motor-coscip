notas:
- A coluna da direita traz o desenho do símbolo; o desenho não é texto e não é conferido aqui (ver a imagem
  da página).
- As células vazias das duas primeiras colunas no alto da página continuam a tabela da página anterior.
- Na grade do PDF, o rótulo girado em duas linhas "ABERTURAS PROTEGIDAS" sai com as letras das duas linhas
  intercaladas ("PARBOETRETGIUDRAASS"); a camada de texto lê a célula certa. É a única célula que diverge.
inconsistencias_da_fonte:
- 'Na grade desenhada, as células de subgrupo não coincidem com os nomes: "ABERTURAS PROTEGIDAS" cobre
  P-90, P-120 e "Parede corta-fogo" (a P-60 fica numa célula vazia); "VEDOS" cobre também "Elevador";
  "ELEVADORES" cobre também "Damper corta-fogo". As mesclas parecem deslocadas uma linha; a leitura segue
  a grade como está desenhada, e o agrupamento pretendido fica para o analista.'
- '"BARRA ANTIPÂNICO", no alto da página, fica fora da célula "SISTEMAS PASSIVOS", com grupo e subgrupo
  vazios.'
