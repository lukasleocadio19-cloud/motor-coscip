inconsistencias_da_fonte:
- 'As células trazem notas sobrescritas numeradas (¹ a ⁷, ex.: NE¹, PF⁴, PF⁴˒⁵), mas as observações da
  tabela (páginas 20 e 21) são identificadas por letras (A) a (K). A correspondência número → letra não
  está escrita na NT: decidir com o analista antes de usar uma nota.'
notas:
- 'Siglas: NE = escada não enclausurada; PF = escada enclausurada à prova de fumaça; PFP = enclausurada
  à prova de fumaça pressurizada (observações J e K). Números colados ao tipo (NE1, PF4, PF4,5…) são as
  notas sobrescritas da imagem.'
- 'As células de Ocupação são mescladas: na publicação, as linhas A-3, A-6, F-5/F-7/F-11 e H-2/H-3 herdam
  a ocupação da linha de cima.'
- 'Observações (A) a (K): ver o texto das páginas 20 e 21.'
