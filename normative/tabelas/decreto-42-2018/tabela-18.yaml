      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para as edificações com ATC superior a 600m². 2-
          A escada de emergência da edificação deve ser do tipo Não Enclausurada, conforme NT específica.
          3- A escada de emergência da edificação deve ser do tipo Enclausurada, conforme NT específica.
          4- As edificações com 15 ou mais pavimentos, qualquer que seja a área construída, devem possuir
          no mínimo duas escadas de emergência. 5- Deve haver Elevador de Emergência para altura maior
          que 60m. 6- Exigido para edificações com altura maior que 60m. 7- Exigido apenas para as edificações
          com ATC igual ou superior a 1.500m². 8- Pode ser substituída por sistema de detecção de incêndio
          e chuveiros automáticos, exceto para as compartimentações das fachadas e selagens dos shafts
          e dutos de instalações. 9- Pode ser substituída por sistema de controle de fumaça, detecção
          de incêndio e chuveiros automáticos, exceto para as compartimentações das fachadas e selagens
          dos shafts e dutos de instalações. 10- Pode ser substituída por sistema de controle de fumaça,
          detecção de incêndio e chuveiros automáticos,até 90 metros de altura, exceto para as compartimentações
          das fachadas e selagens dos shafts e dutos de instalações. 11- Exigido apenas para as edificações
          acima de 60m de altura. OBSERVAÇÕES GERAIS: a) No cômputo do número de pavimentos e definição
          da altura e área das edificações, observar as prescrições da Seção II do Capítulo IV deste Código;
          b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais; c)
          Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.'
