    - - E
      - Escolar e cultura física
      - E-1
      - Escolar em geral
      - Pré-escola (creches, escolas maternais, jardins de infância). Escolas de educação básica, ensino
        fundamental e médio, educação de jovens e adultos, ensino superior, ensino técnico e assemelhados.
        Escolas profissionais em geral.
    - - ^
