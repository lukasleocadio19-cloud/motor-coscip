        e assemelhados
    - - ^
      - ^
      - E-3
      - Espaço para cultura física
      - Locais de ensino e/ou práticas de artes marciais, natação, ginástica (artística, dança, musculação
        e outros) esportes coletivos (tênis, futebol e outros que não estejam incluídos em F-3), sauna,
        casas de fisioterapia e assemelhados. Sem arquibancadas.
