      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para as edificações com ATC superior a 600m². 2-
          Exigido para I-1 e I-2, que possuam somatório de áreas destinadas a estoque ou industrialização
          superior a 1.500m². Para divisão I-1 que, comprovadamente, possuam carga incêndio até 300MJ/m²,
          a exigência de chuveiros automáticos poderá ser substituída por compartimentação horizontal
          em células com área máxima de 3.000m². Para I-1 com carga incêndio superior a 300MJ/m² e I-2,
          a exigência de chuveiros automáticos poderá ser substituída por compartimentação horizontal
          em células com área máxima de 1.500m². 3- Não exigido para as edificações da divisão I-1 que,
          comprovadamente, industrializem ou estoquem apenas materiais incombustíveis. 4- A escada de
          emergência da edificação deve ser do tipo Não Enclausurada, conforme NT específica. 5- A escada
          de emergência da edificação deve ser do tipo Enclausurada, conforme NT específica. 6- As edificações
          com 15 ou mais pavimentos, qualquer que seja a área construída, devem possuir no mínimo duas
          escadas de emergência. 7- Deve haver Elevador de Emergência para altura maior que 60m. 8- Exigido
          acima de 60m de altura. 9- Exigido apenas para as edificações com ATC igual ou superior a 1.500m².
          OBSERVAÇÕES GERAIS: a) No cômputo do número de pavimentos e definição da altura e área das edificações,
          observar as prescrições da Seção II do Capítulo IV deste Código; b) As instalações elétricas
          devem estar em conformidade com as normas técnicas oficiais; c) Observar ainda as exigências
          para os riscos específicos das respectivas Notas Técnicas.'
