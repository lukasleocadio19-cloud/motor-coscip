      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Acionadores manuais serão obrigatórios nos corredores. 2- Dispensado
          nos corredores de circulação. 3- A escada de emergência da edificação deve ser do tipo Não Enclausurada,
          conforme NT específica. 4- A escada de emergência da edificação deve ser do tipo Enclausurada,
          conforme NT específica.As rampas poderão substituir as escadas, desde que atendam a inclinação
          máxima, característica do piso, largura e altura mínima e demais requisitos de saídas de emergência
          estabelecidos na Nota Técnica específica. 5- As edificações com 15 ou mais pavimentos, qualquer
          que seja a área construída, devem possuir no mínimo duas escadas de emergência. 6- Deve haver
          Elevador de Emergência para edificação com altura superior a 15 m, aferida do piso do pavimento
          de escape ao piso do último pavimento. 7- Exigido para edificações com altura maior que 60m
          . 8- Exigido apenas para as edificações com ATC igual ou superior a 1.500m². 9- Exigido para
          selagens dos shafts e dutos de instalações. 10- Pode ser substituída por sistema de controle
          de fumaça, detecção de incêndio e chuveiros automáticos, exceto para as compartimentações das
          fachadas e selagens dos shafts e dutos de instalações. 11- Pode ser substituída por sistema
          de controle de fumaça, detecção de incêndio e chuveiros automáticos, até 60m de altura, exceto
          para as compartimentações das fachadas e selagens dos shafts e dutos de instalações. 12- Exigido
          apenas para as edificações com ATC superior a 600m². 13- Somente nas áreas de depósito superiores
          a 900m² e nos quartos. 14- Deve haver Elevador de Emergência para altura maior que 60m. 15-
          Pode ser substituída por sistema de detecção de incêndio e chuveiros automáticos, exceto para
          as compartimentações das fachadas e selagens dos shafts e dutos de instalações. 16- Deve haver
          controle de fumaça nos átrios. OBSERVAÇÕES GERAIS: a) No cômputo do número de pavimentos e definição
          da altura e área das edificações, observar as prescrições da Seção II do Capítulo IV deste Código;
          b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais; c)
          Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.'
