notas:
- 'Divisões e colunas: M-1 (Túneis rodoviários, metroviários e ferroviários), extensão em metros — Até
  90, Acima de 90 até 500, Acima de 500 até 1000, Acima de 1000 até 3000, Acima de 3000.'
- Nota sobrescrita escrita como algarismo após o X ("X¹" → "X1").
- 'Observações específicas da tabela:'
- 1- Exigido somente para túneis rodoviários.
- 2- Exigido somente para túneis metroviários e ferroviários.
- 'Observações gerais da tabela:'
- a) As estações e terminais de passageiros devem atender as medidas de segurança contra incêndio e pânico
  estabelecidas na Tabela 11 para F-4;
- b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais;
- c) Atender às exigências e condições particulares das medidas de segurança contra incêndio para Túneis,
  de acordo com a Nota Técnica específica;
- d) Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.
