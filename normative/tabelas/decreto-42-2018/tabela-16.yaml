      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para as edificações com mais de 10 pavimentos. 2-
          Deve haver pelo menos um acionador manual, por pavimento, a no máximo 5 m da saída de emergência.
          3- Este sistema poderá ser substituído por chuveiros automáticos nas edificações com até 10
          pavimentos. 4- A escada de emergência da edificação deve ser do tipo Não Enclausurada, conforme
          NT específica. 5- A escada de emergência da edificação deve ser do tipo Enclausurada, conforme
          NT específica. 6- Deve haver, no mínimo, 02 escadas de emergência para edificações com 15 ou
          mais pavimentos. 7- Deve haver Elevador de Emergência para altura maior que 60m. 8- Acima de
          60 m de altura, conforme regulamentação do CBMERJ. 9- Exigido apenas para as edificações com
          ATC igual ou superior a 1.500m². 10- Exigido para as compartimentações das fachadas e selagens
          dos shafts e dutos de instalações. 11- Será exigido somente para as áreas de depósito superiores
          a 900m². OBSERVAÇÕES GERAIS: a) No cômputo do número de pavimentos e definição da altura e área
          das edificações, observar as prescrições da Seção II do Capítulo IV deste Código; b) As instalações
          elétricas devem estar em conformidade com as normas técnicas oficiais; c) Observar as exigências
          para postos de abastecimento de uso público e privado e quanto ao armazenamento de líquidos
          combustíveis e inflamáveis estabelecidos na Nota Técnica específica; d) Observar ainda as exigências
          para os riscos específicos das respectivas Notas Técnicas.'
