notas:
- 'Divisões e colunas: M-4 (Canteiro de obras,..) — ATC ≤ 900 m², 900 m² < ATC ≤ 1.500 m², ATC > 1.500
  m²; M-7 (Pátio de armazenagem) — Qualquer área (não coberta) 5.'
- Nota sobrescrita escrita como algarismo após o X ("X¹" → "X1").
- 'Observações específicas da tabela:'
- 1- Somente para áreas de depósito com materiais combustíveis com mais de 900m².
- 2- Para M-4 aceitam-se as próprias saídas da edificação, podendo as escadas ser do tipo NE. Para M-7
  aceitam-se os arruamentos entre as quadras de armazenamento, conforme Nota Técnica específica.
- 3- Os pátios de armazenagem (M-7) devem possuir hidrante urbano ou fonte de água para captação e utilização
  pelo CBMERJ em caso de incêndio, conforme os requisitos estabelecidos em Nota Técnica específica.
- 4- Quando houver armazenamento de tanque portátil (isotanque) contendo líquidos combustíveis ou inflamáveis
  com capacidade total acima de 20m³ (metros cúbicos).
- 5- Para ocupações subsidiárias, verificar a proteção específica nos termos deste Código.
- 'Observações gerais da tabela:'
- a) No cômputo do número de pavimentos e definição da altura e área das edificações, observar as prescrições
  da Seção II do Capítulo IV deste Código;
- b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais;
- c) Observar também as exigências previstas em normas técnicas específicas;
- d) As áreas a serem consideradas para M-7 são as áreas dos terrenos abertos (lotes) onde há estocagem
  de materiais ou depósito de contêineres;
- e) Quando houver edificação (construção) dentro do terreno das áreas de riscos, deve-se também verificar
  as exigências particulares para cada ocupação;
- f) Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.
