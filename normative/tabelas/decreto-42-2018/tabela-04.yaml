notas:
- Grupo A – Residencial; A-4 classificada quanto ao nº de edificações ou lotes, A-5 quanto ao nº de edificações.
- 'Observações específicas da tabela:'
- 1- As edificações residenciais privativas unifamiliares (A-1) que compõem o agrupamento da divisão A-4,
  quando analisadas individualmente, ficam isentas da exigência de medidas de segurança contra incêndio
  e pânico nos termos do artigo 4º deste Código.
- 2- As edificações residenciais privativas multifamiliares (A-2) que compõem o agrupamento da Divisão
  A-5, devem atender individualmente as medidas de segurança contra incêndio e pânico estabelecidas na
  Tabela 3 para a divisão A-2.
