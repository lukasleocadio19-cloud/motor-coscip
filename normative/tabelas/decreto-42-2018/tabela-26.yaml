notas:
- 'Divisões e colunas: M-2 (Líquidos ou gases inflamáveis ou combustíveis) — Tanques ou cilindros e processos:
  líquidos até 20 m³ ou gases até 10 m³ (b), Tanques ou cilindros e processos: líquidos acima de 20 m³
  ou gases acima de 10 m³ (b), Plataforma de carregamento e descarregamento, Produtos acondicionados:
  líquidos até 20 m³ ou gases até 12.480 kg, Produtos acondicionados: líquidos acima de 20 m³ ou gases
  acima de 12.480 kg.'
- Nota sobrescrita escrita como algarismo após o X ("X¹" → "X1").
- 'Observações específicas da tabela:'
- 1- Não exigido para edificações com área menor ou igual a 900m² e até 02 pavimentos.
- 2- Somente para líquidos inflamáveis e combustíveis, conforme exigências da Nota Técnica específica.
- 3- Luminárias à prova de explosão, nas áreas de risco.
- 4- Exigido apenas para as edificações com ATC igual ou superior a 1.500m².
- 5- Para edificações com 04 ou mais pavimentos.
- 'Observações gerais da tabela:'
- a) No cômputo do número de pavimentos e definição da altura e área das edificações, observar as prescrições
  da Seção II do Capítulo IV deste Código;
- b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais;
- c) Devem ser verificadas as exigências quanto ao armazenamento e processamento (produção, manipulação
  etc.) de líquidos inflamáveis e combustíveis; e manipulação, armazenamento, comercialização e utilização
  de gás liquefeito de petróleo (GLP) e gás natural (GN), constante nas Notas Técnicas específicas;
- d) Considera-se para efeito de gases inflamáveis a capacidade total do volume em água que o recipiente
  pode comportar, expressa em m³ (metros cúbicos);
- e) Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.
inconsistencias_da_fonte:
- Os cabeçalhos de tanques e cilindros remetem a "(b)", mas a observação geral b) trata das instalações
  elétricas; a que define o volume dos gases é a d).
