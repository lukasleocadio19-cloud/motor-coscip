      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para as edificações com ATC superior a 600m². 2-
          Exigido apenas para as edificações com 06 pavimentos. 3- A escada de emergência da edificação
          deve ser do tipo Não Enclausurada, conforme NT específica. 4- A escada de emergência da edificação
          deve ser do tipo Enclausurada, conforme NT específica. 5- As edificações com 15 ou mais pavimentos,
          qualquer que seja a área construída, devem possuir no mínimo duas escadas de emergência. 6-
          Deve haver Elevador de Emergência para altura maior que 60m. 7- Exigido acima de 60m de altura.
          8- Exigido apenas para as edificações com ATC igual ou superior a 1.500m². 9- Pode ser substituída
          por sistema de controle de fumaça, detecção de incêndio e chuveiros automáticos, exceto para
          as compartimentações das fachadas e selagens dos shafts e dutos de instalações. 10- Pode ser
          substituída por sistema de controle de fumaça, detecção de incêndio e chuveiros automáticos,até
          90 metros de altura, exceto para as compartimentações das fachadas e selagens dos shafts e dutos
          de instalações. OBSERVAÇÕES GERAIS: a) No cômputo do número de pavimentos e definição da altura
          e área das edificações, observar as prescrições da Seção II do Capítulo IV deste Código; b)
          As instalações elétricas devem estar em conformidade com as normas técnicas oficiais; c) Observar
          ainda as exigências para os riscos específicos das respectivas Notas Técnicas.'
