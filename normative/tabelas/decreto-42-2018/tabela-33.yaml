notas:
- Anexo IV do Decreto (valores das multas previstas no Termo de Ajustamento de Conduta).
- 'Conferência aritmética: em cada faixa de ATC o risco médio é o dobro do leve e o grande o dobro do
  médio, e o máximo de cada intervalo é o dobro do mínimo.'
inconsistencias_da_fonte:
- A tabela usa "Risco Leve", "Risco Médio" e "Risco Grande"; a classificação de risco da NT 1-04 usa Pequeno,
  Médio 1, Médio 2 e Grande.
