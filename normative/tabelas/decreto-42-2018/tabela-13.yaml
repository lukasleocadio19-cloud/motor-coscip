      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Somente para locais com público acima de 1.000 pessoas. 2- As áreas
          cobertas e sem fechamento lateral, destinadas exclusivamente à proteção dos animais contra intempéries,
          não serão computadas no cálculo da ATC para definição das medidas preventivas, desde que atendidos
          os requisitos de isolamento de risco estabelecidos em Nota Técnica do CBMERJ. 3- Exigido apenas
          para as edificações com ATC superior a 600m². 4- A escada de emergência da edificação deve ser
          do tipo Não Enclausurada, conforme NT específica. 5- A escada de emergência da edificação deve
          ser do tipo Enclausurada, conforme NT específica. 6- As edificações com 15 ou mais pavimentos,
          qualquer que seja a área construída, devem possuir no mínimo duas escadas de emergência. 7-
          Deve haver Elevador de Emergência para altura maior que 60m. 8- Exigido para edificações com
          altura superior a 60m. 9- Exigido apenas para as edificações com ATC igual ou superior a 1.500m².
          10- Pode ser substituída por sistema de detecção de incêndio e chuveiros automáticos, exceto
          para as compartimentações das fachadas e selagens dos shafts e dutos de instalações. OBSERVAÇÕES
          GERAIS: a) No cômputo do número de pavimentos e definição da altura e área das edificações,
          observar as prescrições da Seção II do Capítulo IV deste Código; b) As instalações elétricas
          devem estar em conformidade com as normas técnicas oficiais; c) Observar ainda as exigências
          para os riscos específicos das respectivas Notas Técnicas.'
