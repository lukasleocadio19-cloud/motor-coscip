      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para edificações com ATC superior a 600m². 2- Exigido
          apenas para edificações com 06 pavimentos. 3- A escada de emergência da edificação deve ser
          do tipo Não Enclausurada, conforme NT específica. 4- A escada de emergência da edificação deve
          ser do tipo Enclausurada, conforme NT específica. 5- As edificações do Grupo E consideradas
          de interesse social, ficam dispensadas da exigência de Escada Enclausurada, desde que possuam
          até 04 pavimentos e atendam os requisitos de Saídas de Emergência definidos em Nota Técnica
          do CBMERJ. 6- As edificações com 15 ou mais pavimentos, qualquer que seja a área construída,
          devem possuir no mínimo duas escadas de emergência. 7- Deve haver Elevador de Emergência para
          altura maior que 60m. 8- Somente para a divisão E-1. 9- Exigido apenas para edificações acima
          de 90m de altura. 10- Exigido apenas para as edificações com ATC igual ou superior a 1.500m².
          11- A compartimentação vertical será considerada para as fachadas e selagens dos shafts e dutos
          de instalações. 12- Pode ser substituída por sistema de controle de fumaça, detecção de incêndio
          e chuveiros automáticos, até 90 metros de altura, exceto para as compartimentações das fachadas
          e selagens dos shafts e dutos de instalações. OBSERVAÇÕES GERAIS: a) No cômputo do número de
          pavimentos e definição da altura e área das edificações, observar as prescrições da Seção II
          do Capítulo IV deste Código; b) As instalações elétricas devem estar em conformidade com as
          normas técnicas oficiais; c) Os locais destinados a laboratórios devem ter proteção em função
          dos produtos utilizados; d) Observar ainda as exigências para os riscos específicos das respectivas
          Notas Técnicas.'
