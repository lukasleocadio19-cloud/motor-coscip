      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para edificações que possuam mais de 1.500m² em
          qualquer de seus pavimentos ou mais de 3.000m² de ATC. 2- A escada de emergência da edificação
          deve ser do tipo Não Enclausurada, conforme NT específica. 3- A escada de emergência da edificação
          deve ser do tipo Enclausurada, conforme NT específica. 4- As edificações com 15 ou mais pavimentos,
          qualquer que seja a área construída, devem possuir no mínimo duas escadas de emergência. 5-
          Deve haver Elevador de Emergência para altura maior que 60m. 6- Exigido para edificações com
          público acima de 200 pessoas. 7- Exigido sistema de exaustão de fumaça em conformidade com a
          Nota Técnica específica para lotação até 500 pessoas. 8- Obrigatório para lotação superior a
          500 pessoas, podendo ser substituído por chuveiros automáticos de resposta rápida com reserva
          de incêndio para 30 minutos. Obrigatório para lotação superior a 3.000 pessoas. Obrigatório
          para edificações sem janelas independentemente da lotação. 9- Exigido apenas para as edificações
          com ATC igual ou superior a 1.500m². 10- Pode ser substituída por sistema de controle de fumaça,
          detecção de incêndio e chuveiros automáticos; exceto para as compartimentações das fachadas
          e selagens dos shafts e dutos de instalações. OBSERVAÇÕES GERAIS: a) No cômputo do número de
          pavimentos e definição da altura e área das edificações, observar as prescrições da Seção II
          do Capítulo IV deste Código; b) As instalações elétricas devem estar em conformidade com as
          normas técnicas oficiais; c) Nos locais de concentração de público, antes do início de cada
          evento, é obrigatória a explanação ao público da localização das saídas de emergência, bem como
          dos sistemas de segurança contra incêndio e pânico existentes no local; d) Observar ainda as
          exigências para os riscos específicos das respectivas Notas Técnicas.'
