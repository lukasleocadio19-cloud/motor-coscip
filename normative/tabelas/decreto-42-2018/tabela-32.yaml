          etc.) não é exigido detecção automática de incêndio. Para os hospitais psiquiátricos e assemelhados,
          prever detecção em todos os quartos. 3- A escada de emergência da edificação deve ser do tipo
          Não Enclausurada, conforme NT específica. 4- A escada de emergência da edificação deve ser do
          tipo Enclausurada, conforme NT específica. 5- Deve haver Elevador de Emergência para altura
          maior que 60m. 6- Exigido apenas para edificações acima de 60m de altura. 7- Exigido apenas
          para as edificações com ATC igual ou superior a 1.500m². OBSERVAÇÕES GERAIS: a) No cômputo do
          número de pavimentos e definição da altura e área das edificações, observar as prescrições da
