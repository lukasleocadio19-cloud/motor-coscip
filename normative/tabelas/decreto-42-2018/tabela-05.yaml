      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para as edificações com ATC superior a 600m². 2-
          Exigido para loja com mais de 1.500m² por pavimento ou mais de 3.000m² de área total, que desenvolva
          a atividade de supermercado (C-1) ou loja de departamento (C-1). Nestes casos, a rede de chuveiros
          automáticos deverá ser instalada em toda a área comercial da edificação mista (A-6). 3- Exigido
          somente para as áreas de depósito superiores a 900m². 4- A escada de emergência da edificação
          deve ser do tipo Não Enclausurada, conforme NT específica. 5- A escada de emergência da edificação
          deve ser do tipo Enclausurada, conforme NT específica. As edificações com 04 pavimentos e comércio
          somente no térreo poderão adotar escada de emergência do tipo Não Enclausurada, conforme NT
          específica. 6- A escada de emergência da edificação deve ser do tipo Enclausurada, conforme
          NT específica. As edificações com 25 ou mais pavimentos, qualquer que seja a área construída,
          devem possuir no mínimo duas escadas de emergência. 7- Deve haver Elevador de Emergência para
          altura maior que 80m. 8- Exigido acima de 60m de altura. 9- Exigido apenas para as edificações
          com ATC igual ou superior a 1.500m². 10- Aplica-se somente às áreas comerciais da edificação.
          11- Aplica-se somente às áreas comerciais e todas as áreas comuns da edificação. OBSERVAÇÕES
          GERAIS: a) As edificações da Divisão A-1 ficam isentas de exigência de medidas preventiva nos
          termos do artigo 4º deste Código; b) No cômputo do número de pavimentos e definição da altura
          e área das edificações, observar as prescrições da Seção II do Capítulo IV deste Código; c)
          As instalações elétricas devem estar em conformidade com as normas técnicas oficiais; d) Observar
          ainda as exigências para os riscos específicos das respectivas Notas Técnicas.'
