notas:
- 'Divisões e colunas: L-1 (comércio de fogos de artifício,..) — Térrea, 2pav, 3pav, 4, 5 e 6pav, Acima
  de 6pav com H ≤ 30m, H > 30m.'
- Nota sobrescrita escrita como algarismo após o X ("X¹" → "X1").
- 'Observações específicas da tabela:'
- 1- Exigido para as edificações que possuam mais de 1.500m² em qualquer de seus pavimentos ou mais de
  3.000m² de ATC.
- 2- Somente para as áreas acessíveis ao público (área de vendas) e rotas de escape. Não deve ser instalada
  no interior das áreas de depósito e armazenamento de fogos de artifício e artefatos pirotécnicos.
- 3- A escada de emergência da edificação deve ser do tipo Não Enclausurada, conforme NT específica.
- 4- A escada de emergência da edificação deve ser do tipo Enclausurada, conforme NT específica.
- 5- As edificações com 15 ou mais pavimentos, qualquer que seja a área construída, devem possuir no mínimo
  duas escadas de emergência.
- 6- Deve haver Elevador de Emergência para altura maior que 60m.
- 7- Exigido acima de 60m de altura.
- 8- Exigido apenas para edificações com mais de 1.500m² de ATC.
- 9- Pode ser substituída por sistema de detecção de incêndio e chuveiros automáticos, exceto para as
  compartimentações das fachadas e selagens dos shafts e dutos de instalações.
- 10- Pode ser substituída por sistema de controle de fumaça, detecção de incêndio e chuveiros automáticos,
  exceto para as compartimentações das fachadas e selagens dos shafts e dutos de instalações.
- 11- Pode ser substituída por sistema de controle de fumaça, detecção de incêndio e chuveiros automáticos,
  até 90 metros de altura, exceto para as compartimentações das fachadas e selagens dos shafts e dutos
  de instalações.
- 'Observações gerais da tabela:'
- a) No cômputo do número de pavimentos e definição da altura e área das edificações, observar as prescrições
  da Seção II do Capítulo IV deste Código;
- b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais;
- c) As atividades de fabricação, utilização, armazenagem, depósito e comércio de explosivos e munições
  devem obedecer ao disposto na legislação específica e regulamentações do Exército Brasileiro;
- d) Atender às exigências e condições particulares das medidas de segurança contra incêndio para as edificações
  destinadas a fabricação, armazenagem e comércio de munições, explosivos e artefatos pirotécnicos, estabelecidas
  na Nota Técnica específica;
- e) Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.
