notas:
- 'Divisões e colunas: M-6 (geração, transmissão e distribuição de energia, ...) — Térrea, 2pav, 3pav,
  4, 5 e 6pav, Acima de 6pav com H ≤ 30m, H > 30m.'
- Nota sobrescrita escrita como algarismo após o X ("X¹" → "X1").
- 'Observações específicas da tabela:'
- 1- Exigido apenas quando a ATC for superior a 900m².
- 2- O sistema de chuveiros automáticos pode ser substituído por sistema fixo de gases para combate a
  incêndio, através de supressão total do ambiente, dimensionado conforme requisitos estabelecidos em
  NT do CBMERJ. Poderá, ainda, ser substituído por outros sistemas fixos de supressão de incêndio, compatíveis
  ao risco específico do ambiente e em conformidade com normas técnicas reconhecidas, desde que submetidos
  à análise do CBMERJ através de Comissão de Análise Técnica (CAT).
- 3- A escada de emergência da edificação deve ser do tipo Não Enclausurada, conforme NT específica.
- 4- A escada de emergência da edificação deve ser do tipo Enclausurada, conforme NT específica.
- 5- Exigido apenas quando a ATC for igual ou superior a 1.500m².
- 'Observações gerais da tabela:'
- a) No cômputo do número de pavimentos e definição da altura e área das edificações, observar as prescrições
  da Seção II do Capítulo IV deste Código;
- b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais;
- c) Para as subestações elétricas deve-se observar também os requisitos da Nota Técnica específica;
- d) Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.
