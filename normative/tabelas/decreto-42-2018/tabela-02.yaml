          para as torres de comunicação (M-3) onde não haja edificação. 2- Exigido somente para lotação
          superior a 200 pessoas. 3- Exigido sistema de exaustão de fumaça em conformidade com a Nota
          Técnica específica para lotação até 500 pessoas. 4- Obrigatório para lotação superior a 500
          pessoas, podendo ser substituído por chuveiros automáticos de resposta rápida com reserva de
          incêndio para 30 minutos. Obrigatório para lotação superior a 3.000 pessoas. Obrigatório para
          edificações sem janelas independentemente da lotação. OBSERVAÇÕES GERAIS: a) No cômputo do número
          de pavimentos e definição da altura e área das edificações, observar as prescrições da Seção
          II do Capítulo IV deste Código; b) As instalações elétricas devem estar em conformidade com
          as normas técnicas oficiais; c) Para o Grupo M (especiais), ver tabelas específicas, ressalvadas
          as medidas de segurança estabelecidas para a classificação M3; d) Para a divisão G-5 (Hangares),
          prever sistema de drenagem de líquidos nos pisos para bacias de contenção à distância. Não é
          permitido o armazenamento de líquidos combustíveis ou inflamáveis dentro dos hangares, exceto
          aqueles destinados exclusivamente a grupos motogeradores ou conjuntos de pressurização para
          sistemas de combate a incêndio; e) Para a divisão L-1 (comércio de fogos de artifício e munições)
          atender a Nota Técnica específica. As divisões L-2 e L-3 somente serão avaliadas pelo CBMERJ
          através de Comissão de Análise Técnica; f) Observar ainda as exigências para os riscos específicos
          nas respectivas Notas Técnicas.'
