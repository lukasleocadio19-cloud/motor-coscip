notas:
- 'Divisões e colunas: J-3 (risco médio 2) — Térrea, 2pav, 3pav, 4, 5 e 6pav, Acima de 6pav com H ≤ 30m,
  H > 30m; J-4 (risco grande) — Térrea, 2pav, 3pav, 4, 5 e 6pav, Acima de 6pav com H ≤ 30m, H > 30m.'
- Nota sobrescrita escrita como algarismo após o X ("X¹" → "X1").
- 'Observações específicas da tabela:'
- 1- Exigido para os galpões com somatório de áreas destinadas a estoque ou industrialização superior
  a 1.500m². A exigência de chuveiros automáticos poderá ser substituída por compartimentação horizontal
  em células com área máxima de 1.500m², conforme regulamentação do CBMERJ.
- 2- A escada de emergência da edificação deve ser do tipo Não Enclausurada, conforme NT específica.
- 3- A escada de emergência da edificação deve ser do tipo Enclausurada, conforme NT específica.
- 4- As edificações com 15 ou mais pavimentos, qualquer que seja a área construída, devem possuir no mínimo
  duas escadas de emergência.
- 5- Deve haver Elevador de Emergência para altura maior que 60m.
- 6- Exigido apenas para as edificações com ATC igual ou superior a 1.500m².
- 7- Pode ser substituída por sistema de controle de fumaça, detecção de incêndio e chuveiros automáticos,
  exceto para as compartimentações das fachadas e selagens dos shafts e dutos de instalações.
- 'Observações gerais da tabela:'
- a) No cômputo do número de pavimentos e definição da altura e área das edificações, observar as prescrições
  da Seção II do Capítulo IV deste Código;
- b) As instalações elétricas devem estar em conformidade com as normas técnicas oficiais;
- c) Observar ainda as exigências para os riscos específicos das respectivas Notas Técnicas.
