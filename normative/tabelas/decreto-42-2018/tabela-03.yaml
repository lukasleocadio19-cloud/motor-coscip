      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Exigido apenas para as edificações com ATC superior a 600m². 2-
          Exigido apenas para as edificações com ATC superior a 900m². 3- A escada de emergência da edificação
          deve ser do tipo Não Enclausurada, conforme NT específica. 4- A escada de emergência da edificação
          deve ser do tipo Enclausurada, conforme NT específica. 5- Deve haver, no mínimo, 02 escadas
          de emergência para edificações com 25 ou mais pavimentos. 6- Deve haver Elevador de Emergência
          para altura maior que 80m. 7- Exigido apenas para as edificações com ATC igual ou superior a
          1.500m². 8- Aplica-se somente às áreas comuns da edificação. 9- As edificações da Divisão A-3
          com 15 ou mais pavimentos, qualquer que seja a área construída, devem possuir no mínimo duas
          escadas de emergência. 10- Deve haver Elevador de Emergência para altura maior que 60m. OBSERVAÇÕES
          GERAIS: a) As edificações da Divisão A-1 ficam isentas de exigência de medidas preventiva nos
          termos do artigo 4º deste Código; b) No cômputo do número de pavimentos e definição da altura
          e área das edificações, observar as prescrições da Seção II do Capítulo IV deste Código; c)
          As instalações elétricas devem estar em conformidade com as normas técnicas oficiais; d) Observar
          ainda as exigências para os riscos específicos das respectivas Notas Técnicas.'
