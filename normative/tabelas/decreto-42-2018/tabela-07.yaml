      - - 'OBSERVAÇÕES ESPECÍFICAS: 1- Para C-1 e C-4 será exigido apenas para as edificações com ATC
          superior a 600m². Para C-2 e C-3 será exigido com qualquer ATC. 2- Exigido apenas para o estabelecimento
          comercial com mais de 1.500m² por pavimento ou mais de 3.000m² de área total, que desenvolva
          a atividade de supermercado (C-1), loja de departamento (C-1) ou shopping center (C-3). Nestes
          casos, a rede de chuveiros automáticos deverá ser instalada em toda a edificação comercial.
          A rede de chuveiros automáticos poderá ser substituída por compartimentação horizontal em células
          com área máxima de 1.500m², exceto quando a ATC for superior a 3.000m². 3- Para C-1 e C-2 e
          C-4 será exigido somente para as áreas de depósito superiores a 900m². Para C-3 será exigido
          para toda a edificação, sempre que a ATC da edificação for superior a 900m². 4- A escada de
          emergência da edificação deve ser do tipo Não Enclausurada, conforme NT específica. 5- A escada
          de emergência da edificação deve ser do tipo Enclausurada, conforme NT específica. 6- As edificações
          com 15 ou mais pavimentos, qualquer que seja a área construída, devem possuir no mínimo duas
          escadas de emergência. 7- Deve haver Elevador de Emergência para altura maior que 60m. 8- Exigido
          apenas para edificações da divisão C-3 (shopping centers). 9- Exigido acima de 60m de altura.
          10- Exigido apenas para as edificações com ATC igual ou superior a 1.500m². 11- Pode ser substituída
          por sistema de detecção de incêndio e chuveiros automáticos, exceto para as compartimentações
          das fachadas e selagens dos shafts e dutos de instalações. 12- Deve haver controle de fumaça
          nos átrios. 13- Pode ser substituída por sistema de controle de fumaça, detecção de incêndio
          e chuveiros automáticos, exceto para as compartimentações das fachadas e selagens dos shafts
          e dutos de instalações. 14- Pode ser substituída por sistema de controle de fumaça, detecção
          de incêndio e chuveiros automáticos, até 90 metros de altura, exceto para as compartimentações
          das fachadas e selagens dos shafts e dutos de instalações. OBSERVAÇÕES GERAIS: a) As edificações
          da Divisão C-4 devem atender as exigências estabelecidas em Nota Técnica específica; b) No cômputo
          do número de pavimentos e definição da altura e área das edificações, observar as prescrições
          da Seção II do Capítulo IV deste Código; c) As instalações elétricas devem estar em conformidade
          com as normas técnicas oficiais; d) Observar ainda as exigências para os riscos específicos
          das respectivas Notas Técnicas.'
