notas:
- 'Legenda da tabela (continua no alto da página 9):'
- 'a) Para até dois tanques vizinhos: Taxa por metro quadrado de metade do somatório das áreas do teto
  e costado dos tanques vizinhos. Para tanques de teto flutuante, não pode ser considerada a área do teto.'
- 'b) Para mais de dois tanques vizinhos: Taxa por metro quadrado de um terço do somatório das áreas dos
  tetos e costados dos tanques vizinhos. Para tanques de teto flutuante, não podem ser consideradas as
  áreas dos tetos.'
- 'Fonte indicada na página: ABNT NBR 17505.'
