    - - 01 Equipamento de Operação Manual
      - '- Conhecer os tipos e a operação de: extintores (portáteis e extintores sobre rodas, com carga
        de água, pó BC, CO2, etc.), hidrantes (predial, de coluna e subterrâneo), mangotinho, mangueiras
        de incêndio, chaves de mangueira (simples e mista), redutores, tampões e adaptadores para mangueiras
        e hidrantes, derivantes, válvula de recalque, passagem de nível, esguichos e proporcionadores
        de espuma (de linha e de sistema).'
      - 2h
      - 'Demonstrar na prática os tipos e a operação de: extintores (portáteis e extintores sobre rodas,
        com carga de água, pó BC, CO2, etc.), hidrantes (predial, de coluna e subterrâneo), mangotinho,
        mangueiras de incêndio, chaves de mangueira (simples e mista), redutores, tampões e adaptadores
        para mangueiras e hidrantes, derivantes, válvula de recalque, passagem de nível, esguichos e proporcionadores
        de espuma (de linha e de sistema).'
      - 2h
    - - 02 Equipamento de Sistema fixo e operação automática
      - '- Conhecer os equipamentos e os principais procedimentos de emergência para o correto funcionamento
        de bombas (elétricas e a combustão), chuveiros automáticos (sprinklers) e sistemas fixos de combate
        a incêndio (com espuma mecânica, gases etc.).'
      - 1h
      - '- Demonstrar na prática os equipamentos e os principais procedimentos de emergência para o correto
        funcionamento de bombas (elétricas e a combustão), chuveiros automáticos (sprinklers) e sistemas
        fixos de combate a incêndio (com espuma mecânica, gases etc.).'
      - 4h
    - - 03 Equipamentos Auxiliares
      - '- Conhecer como transportar e armar uma escada prolongável. - Conhecer como operar no mínimo
        as seguintes ferramentas de corte, arrombamento e remoção (machado, machado-picareta, corta-a-frio,
        croque, alavanca simples, alavanca pé-de-cabra e ferramentas hidráulicas de corte e tração); -
        Conhecer e operar lanternas e refletores portáteis para iluminação; - Conhecer e utilizar na prática
        uma lona para salvatagem.'
      - 1h
