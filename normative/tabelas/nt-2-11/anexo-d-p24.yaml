notas:
- 'Leitura visual em grade completa: "^" = mesclada com a de cima; "<" = mesclada com a da esquerda (ex.:
  "Não exigível" que abrange mais de uma faixa de área); "" = célula em branco. As linhas "Edificação
  histórica…" (fundo amarelo) não trazem valor em nenhuma faixa.'
inconsistencias_da_fonte:
- 'As linhas "Edificação histórica com isenção de canalização ****" estão em branco nas três faixas de
  área: a NT não diz quantos BC se exigem nesses casos.'
- A marca "****" não é definida no quadro de observações (página 26), que só traz Obs1 a Obs8.
