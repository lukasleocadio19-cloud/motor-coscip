    - - 02 EPR
      - '- Conhecer e saber a origem e os riscos de exposição a no mínimo os seguintes tipos de gases:
        asfixiantes – gás liquefeito de petróleo (GLP), gás metano (CH4), dióxido de carbono (CO2) e acetileno;
        gases tóxicos – monóxido de carbono (CO), sulfídrico (H2S) e cianídrico (HCN) e gases irritantes
        ou corrosivos – amônia (NH2) e cloro; - Conhecer as características de atmosfera insalubre por
        concentração de O2; - Conhecer a utilização e a higienização e limpeza dos seguintes equipamentos
        de proteção respiratória: máscaras filtrantes e conjunto de máscara autônoma de ar respirável
        e máscara dedicada para a vítima (carona); - Saber calcular a autonomia do conjunto de máscara
        autônoma. - Conhecer e saber identificar a finalidade dos impressos nos cilindros de ar respirável.'
      - 4h
      - Demonstrar a utilização (montar o equipamento, equipar-se e deslocar-se com e sem vítima); Exercitar
        o calculo de autonomia do conjunto autônomo de respiração.
