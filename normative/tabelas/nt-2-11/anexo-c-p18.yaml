notas:
- 'Leitura visual em grade completa: "^" = célula mesclada com a de cima (grupo, ocupação, divisão); "<"
  = célula mesclada com a da esquerda ("Não exigível" e "Vide NT 5-04" valem para as duas faixas). Linhas
  "Edificação histórica…" em fundo amarelo na imagem.'
inconsistencias_da_fonte:
- A marca "****" (edificação histórica com isenção de canalização) é usada em todas as linhas destacadas,
  mas o quadro de notas da página 21 só define "*" e "***".
- 'F-1: 30% da população fixa na linha comum e 10% na linha da edificação histórica (demais divisões:
  10% nas duas).'
