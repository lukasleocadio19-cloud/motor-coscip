      - 30 min.
      - ''
      - ''
    - - 03 Teoria do fogo
      - '- Conhecer os quatro elementos formadores da combustão, as formas de propagação do calor, as
        temperaturas do fogo, os métodos de extinção do fogo, classificação dos incêndios, os principais
        agentes extintores, unidade extintora e capacidade extintora, as fases do combate ao fogo, o Flashover,
        o Backdraft, o Bleve e o Boil Over.'
      - 1h
      - ''
      - ''
    - - 04 Proteção Contra Incêndio
      - '- Conhecer os conceitos gerais de prevenção, educação e proteção contra incêndio; noções de proteção
        passiva e proteção ativa: isolamento de risco, compartimentação vertical e horizontal; noções
        de resistência das estruturas e dos materiais ao fogo; - Conhecer os equipamentos fixos e portáteis
        de combate a incêndio, saídas de emergência, escalas de segurança, corredores e rotas de fuga,
        sistemas de iluminação de emergência, elevador de segurança, meios de aviso, detecção e alarme
        de incêndio e sinalização de emergência.'
      - 1h
      - '- Demonstrar os principais procedimentos para o funcionamento do sistema de meios de fuga: saídas
        de emergência, escadas de segurança, corredores e rotas de fuga; dos sistemas de iluminação de
        emergência; do elevador de segurança; dos meios de aviso detecção e alarme de incêndio; da sinalização
        de emergência.'
      - 4h
    - - 05 Técnicas e Táticas de Combate a Incêndio
      - '- Conhecer as principais técnicas de busca e exploração da área em sinistro, ventilação natural
        ou forçada (pressão negativa, venturi e positiva), entradas forçadas, resgate de vítimas, confinamento,
        isolamento, salvatagem, combate com emprego correto dos tipos de jato de água (neblina, cone de
        força e sólido), emprego, dimensionamento e técnicas de aplicação de espuma mecânica e rescaldo
        de incêndio; - Demonstrar a montagem de uma linha direta de combate a incêndio, a partir de um
        hidrante e/ou viatura, linha adutora e linha siamesa; - Demonstrar o uso da linha de água para
        ataque direto, ataque indireto e ataque combinado.'
