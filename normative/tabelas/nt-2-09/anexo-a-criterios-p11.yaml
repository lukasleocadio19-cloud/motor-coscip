notas:
- 'Observações da tabela:'
- (A) Para as edificações classificadas nas ocupações Locais de Reunião de Público deverão ser avaliadas
  a capacidade populacional da edificação.
- (B) As edificações classificadas como M-9 (presídios e similares) deverão seguir os critérios estabelecidos
  na NT 4-02 – Edificações destinadas à restrição de liberdade.
- 'Fonte indicada na página: CBMERJ.'
inconsistencias_da_fonte:
- 'No grupo F a coluna "Critério de Altura (metros)" traz "Até 200 (A)" / "Acima de 200 (A)", e a observação
  (A) manda avaliar a capacidade populacional: a página não diz se 200 é altura em metros ou população.'
- Não constam da tabela as divisões F-7, M-4, M-7 e M-8.
