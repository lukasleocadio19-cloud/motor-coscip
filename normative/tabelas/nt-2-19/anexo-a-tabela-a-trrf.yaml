notas:
- 'Anexo A da NT 2-19. "^" = mesclada com a de cima; "<" = mesclada com a da esquerda ("ver item 5.3.3",
  "ver item 5.3.4" e "-" que abrangem várias classes). Valores entre parênteses: observação 3 (pavimentos
  de até 900 m² com compartimentação vertical).'
- 'A camada de texto perdeu os sinais das classes ("6mh12m", "hs10m"); a leitura visual os restitui: S2
  hs>10m, S1 hs≤10m, P1 h≤6m, P2 6m<h≤12m, P3 12m<h≤23m, P4 23m<h≤30m, P5 30m<h≤80m, P6 80m<h≤120m, P7
  120<h≤150 m, P8 150m<h≤250 m.'
- 'Observações 1 a 6 abaixo da tabela: ver o texto da página 9. Fonte indicada: CBMERJ.'
inconsistencias_da_fonte:
- Classe P7 escrita "120<h≤150 m" (sem "m" depois de 120), diferente das demais classes.
