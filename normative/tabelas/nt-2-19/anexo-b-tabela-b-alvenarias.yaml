- 'Anexo B da NT 2-19. "^" = mesclada com a de cima; "<" = mesclada com a da esquerda (o traço do concreto
  armado ocupa as colunas de características). Fonte indicada: ABNT NBR 15758:2009.'
- 'Notas da tabela (fora da comparação): (*) paredes sem função estrutural ensaiadas totalmente vinculadas
  dentro da estrutura de concreto armado, 2,8 m x 2,8 m, expostas ao fogo em uma face; (**) ensaio encerrado
  sem falência em nenhum dos três critérios.'
inconsistencias_da_fonte:
- 'Em duas linhas a resistência ao fogo supera o menor dos três critérios de avaliação: "Um tijolo com
  revestimento" de barro cozido (integridade ≥ 240, resistência > 360) e concreto armado de 11,5 cm (isolação
  60, resistência 90). Nas demais linhas a resistência é o menor critério.'
