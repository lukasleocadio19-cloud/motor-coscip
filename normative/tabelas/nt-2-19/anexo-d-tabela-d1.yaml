notas:
- Anexo D da NT 2-19 (redução do TRRF, equação D1). Na ausência do meio de proteção, o respectivo γn =
  1.
- 'Divergência técnica nas células de valor: a camada de texto perde o γ (fonte Symbol) e desloca o índice
  "n1" para depois do número ("γ =0,60 n1"); a ordem dos números muda e a comparação não aceita. Valores
  lidos na imagem: 0,60 (chuveiros), 0,90 (brigada), 0,90 (detecção). Aguarda o caminho geométrico.'
inconsistencias_da_fonte:
- Os três fatores estão rotulados "γn1" na tabela, mas o texto define γn = γn1 × γn2 × γn3 (chuveiros,
  brigada e detecção seriam γn1, γn2 e γn3).
