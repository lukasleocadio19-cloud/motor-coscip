notas:
- 'Observações da tabela:'
- a) Centrais com capacidade acima do limite estabelecido na Tabela 2 devem ser analisadas por órgãos
  competentes considerando situações temporárias e se em caso definitivas com as devidas medidas mitigadoras
  compensatórias definidas
- b) Afastamento não aplicável para centrais GLP instaladas em nicho conforme item 5.7.2 desta NT.
- c) Caso o local destinado à instalação da central que utilize recipientes transportáveis não permita
  os afastamentos acima, a central pode ser subdividida com a utilização de paredes divisórias resistentes
  ao fogo com TRRF mínimo de 120 min, material aprovado conforme ABNT NBR 10636, com comprimento e altura
  de dimensões superiores ao recipiente. Neste caso, deve se adotar o afastamento mínimo referente à capacidade
  total de cada subdivisão da central de GLP.
- d) Para recipientes contidos em abrigos, com paredes laterais e cobertura resistente ao fogo com TRRF
  = 2 h, interpondo-se entre os recipientes e o ponto considerado, a distância pode ser reduzida à metade.
- 'Fonte indicada na página: ABNT NBR 13523:2019.'
