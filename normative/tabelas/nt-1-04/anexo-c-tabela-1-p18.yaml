notas:
- 'Continuação da Tabela 1 do Anexo C. Fonte indicada: ABNT NBR 14432.'
- 'Conferência aritmética (além dos dois caminhos): em cada linha a carga é proporcional à altura de armazenamento
  (valor em 2 m ÷ 2 × altura, arredondado).'
- 'Observações da tabela (fora da comparação): a) pode haver interpolação entre os valores; b) a carga
  de incêndio para depósitos desta tabela pode ser substituída pelo método determinístico.'
inconsistencias_da_fonte:
- '"Tapeçarias" aparece duas vezes com valores diferentes (765…7650 e 900…9000): a NT não diz qual usar.'
- A linha "Depósitos de mercadorias incombustíveis em pilhas de caixas de plástico" repete a da página
  17 (mesmos valores).
- A observação b) remete ao método determinístico como "Anexo E"; o método determinístico é o Anexo D
  (o Anexo E é o exemplo de planilha). No texto também está "Obsservações".
