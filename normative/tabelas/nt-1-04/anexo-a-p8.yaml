notas:
- Classificação quanto à ocupação (NT 1-04, Anexo A), páginas 5 a 10; um arquivo por página. "^" = célula
  mesclada com a de cima (grupo e ocupação). Hifenização de fim de linha da imagem ("alo-jamentos", "iso-por")
  desfeita.
inconsistencias_da_fonte:
- 'Numeração de H-1 e H-3 diferente de outras NTs: aqui H-1 é "Hospital veterinário" e H-3 "Hospital e
  assemelhados"; a NT 2-08 (Anexo A, observação H: "hospitais e clínicas com internamento (H-1)") e a
  NT 2-11 (Anexos C e D: H-1 "Hospital e assemelhado", H-3 "Hospital veterinário") usam a numeração inversa.'
