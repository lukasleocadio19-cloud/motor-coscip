notas:
- 'Nota 1 da tabela: O alcance horizontal do jato compacto produzido pelas linhas manuais de resfriamento
  deve ser medido da saída do esguicho ao ponto de queda do jato, porém este alcance deve ser desconsiderado
  quando da aplicação de 6.5.1.'
- 'Fonte indicada na página: CBMERJ.'
