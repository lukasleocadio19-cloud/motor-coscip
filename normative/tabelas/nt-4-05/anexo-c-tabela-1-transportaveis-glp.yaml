notas:
- 'Legenda da tabela:'
- '- Classe IVA: Pertencente à Classe IV estabelecida na Lei Estadual nº 4945/06, e equivalente à Classe
  IV definida na ABNT NBR 15514:2020.'
- '- Classe IVB: Pertencente à Classe IV estabelecida na Lei Estadual nº 4945/06, e equivalente à Classe
  V definida na ABNT NBR 15514:2020.'
- '- Classe V: Correspondente à Classe V estabelecida na Lei Estadual nº 4945/06, e equivalente à Classe
  VI definida na ABNT NBR 15514:2020.'
- '- Classe VI: Correspondente à Classe VI estabelecida na Lei Estadual nº 4945/06, e equivalente à Classe
  VII definida na ABNT NBR 15514:2020.'
- 'Observações da tabela:'
- 1) Para fins da aplicação desta NT, considera-se local de reunião de público todas as edificações constantes
  no Grupo F, E1 e E2, H2 e H3, todas conforme as classificações constantes na Tabela 1 do Anexo II do
  Decreto Estadual nº 42 – COSCIP.
- 2) Com a construção de paredes resistentes a 120 min de fogo, as distâncias mínimas de segurança podem
  ser reduzidas pela metade, excetuando-se o distanciamento entre os lotes.
- 3) A distância da área de armazenamento às aberturas para captação de águas pluviais, canaletas, ralos,
  rebaixos ou similares deve ser de, no mínimo, 1,50 m.
- 4) Os veículos transportadores que necessitarem permanecer estacionados no interior do imóvel devem
  distar, no mínimo, 3 m dos limites da área de armazenamento.
- 5) Os afastamentos, inclusive para os Locais de reunião de público, escolar e cultura física e serviços
  de saúde, deverão serem demonstrados na planta de situação e localização
- 'Fonte indicada na página: ABNT NBR 15514 - Adaptado, combinado com a Lei Estadual nº 4945/06.'
- 'Conferência aritmética: 13 kg × número de botijões = capacidade máxima em todas as classes (520 a 99.840
  kg).'
