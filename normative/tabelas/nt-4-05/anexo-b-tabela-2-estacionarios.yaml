          (alínea f de 5.1.6), todavia, para aplicação dos critérios é analisado a capacidade de armazenamento
          individual do recipiente. 2) Caso as baterias de recipientes de GLP com capacidade individual
          de, no máximo, 60 m³ estiverem com afastamentos de 15 m ou mais, entre si, podem ser consideradas
          isoladas. 3) Deve ser previsto resfriamento para a esfera submetida ao incêndio, bem como para
          as esferas e baterias de recipientes de GLP cuja distância entre costados seja inferior a 30
          m. 4) Para recipientes de volume individual inferior a 200 m³ submetida ao incêndio, devem ser
          resfriados todos os recipientes, independentemente de sua capacidade volumétrica cuja distância,
          entre costados, seja inferior a 15 m. 5) Um ou mais recipientes de volume individual igual ou
          superior a 200 m³ devem ser considerados equivalentes a uma esfera. 6) Quando o suprimento de
          água sair da rede de incêndio da edificação/área de risco deve-se somar a maior vazão estabelecida,
