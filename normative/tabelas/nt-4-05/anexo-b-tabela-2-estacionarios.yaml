notas:
- 'Observações da tabela:'
- 1) Essa tabela se aplica quando o somatório dos recipientes for maior que 15 m³ (alínea f de 5.1.6),
  todavia, para aplicação dos critérios é analisado a capacidade de armazenamento individual do recipiente.
- 2) Caso as baterias de recipientes de GLP com capacidade individual de, no máximo, 60 m³ estiverem com
  afastamentos de 15 m ou mais, entre si, podem ser consideradas isoladas.
- 3) Deve ser previsto resfriamento para a esfera submetida ao incêndio, bem como para as esferas e baterias
  de recipientes de GLP cuja distância entre costados seja inferior a 30 m.
- 4) Para recipientes de volume individual inferior a 200 m³ submetida ao incêndio, devem ser resfriados
  todos os recipientes, independentemente de sua capacidade volumétrica cuja distância, entre costados,
  seja inferior a 15 m.
- 5) Um ou mais recipientes de volume individual igual ou superior a 200 m³ devem ser considerados equivalentes
  a uma esfera.
- 6) Quando o suprimento de água sair da rede de incêndio da edificação/área de risco deve-se somar a
  maior vazão estabelecida, ao valor correspondente ao uso de dois canhões monitores fixos (vazão individual
  por canhões de 1.200 lpm).
- 7) A localização dos cilindros e esferas de GLP deve atender às normas técnicas oficiais.
- 8) O armazenamento de GLP em tanques subterrâneos não necessita de proteção contra incêndios por resfriamento.
- 9) O alcance horizontal do jato compacto produzido pelas linhas manuais de resfriamento deve ser medido
  da saída do esguicho ao ponto de queda do jato, porém este alcance deve ser desconsiderado quando da
  aplicação de 6.5.1.
- 10) Ver alínea “g” de 5.1.6.
- 'Fonte indicada na página: CBMERJ.'
inconsistencias_da_fonte:
- A linha "Mínimo alcance horizontal do jato compacto (linha manual)" remete à nota 8, que trata de tanques
  subterrâneos; a nota sobre o alcance do jato é a 9 (na Tabela 1 deste anexo, a mesma linha remete à
  nota 1, de mesmo texto).
- '"30 mim", "40 mim" e "60 mim" na linha Tempo (as outras colunas dizem "min").'
- 10 m³ exatos não estão em nenhuma coluna ("Inferior a 10 m³" / "Superior a 10 m³").
