    - - 'Obs.: 1 - Apenas referência. A capacidade de armazenamento deve sempre ser medida em kg de GLP.
        2 - Os pontos de venda no perímetro urbano ficam limitados a 10 unidades de botijões de 13 kg
        – Ver 5.2.6. 3 - Os pontos de venda no perímetro rural ficam limitados a 30 unidades de botijões
        de 13 kg - Ver 5.2.6. 4 - Os pontos de venda de recipientes de GLP em postos revendedores de combustíveis
        líquidos ficam limitados a 10 unidades de botijões de 13 kg - Ver 5.2.7. 5 - O(s) lote(s) pode(m)
        conter recipientes transportáveis de GLP cheios, parcialmente cheios e vazios, desde que atendida
        a quantidade de botijões permitida de acordo com a classe.'
