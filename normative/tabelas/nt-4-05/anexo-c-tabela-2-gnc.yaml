notas:
- 'Afastamentos em metros. "0/3" e "1/3": ver a observação e) (até 200 m³ com grade, 3 m).'
- 'Observações da tabela:'
- a) As Distâncias mínimas dos afastamentos são determinadas em função da capacidade total da estocagem
  e do tipo de fronteira encontrada (parede comum ou grade, ou parede de TRRF=4);
- b) Para a existência, na área adjacente a estocagem, de circulação de pessoas e/ou veículos, de aberturas
  ou janelas em qualquer construção ou de limite de propriedade, as distâncias mínimas de afastamentos
  apresentadas na tabela 2 são sempre entre a estocagem e as fronteiras físicas (parede comum ou grade,
  ou parede de TRRF=4) de separação;
- c) A parede TRRF=4 deve ter altura mínima de 2,0m e ultrapassar a estocagem em no mínimo 1,00 m das
  extremidades laterais. As distâncias de afastamentos devem obedecer à coluna de paredes TRRF=4;
- d) Para o caso das aberturas de edifícios adjacentes posicionadas em alturas superiores às das paredes
  corta-fogo, devem ser adotadas as distâncias para parede comum ou grades;
- e) Para capacidade volumétrica total de armazenamento de até 200 m³, caso a divisa de local público
  e/ou limite de propriedade seja com grade, a distância mínima para armazenamento deve ser 3 m;
- 'Fonte indicada na página: ABNT NBR 15600.'
inconsistencias_da_fonte:
