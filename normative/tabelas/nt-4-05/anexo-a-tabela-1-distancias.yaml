notas:
- 'Observações da tabela:'
- a) Para a leitura desta tabela as letras maiúsculas têm o mesmo significado tanto na horizontal, quanto
  na vertical;
- b) Ver Tabela 1 desta NT.
- c) Ver na Tabela 2 deste anexo a indicação da distância de segurança recomendada à divisa de propriedade
  ou via pública para recipientes estacionários com capacidade volumétrica individual superior a 120 m³.
- d) Válido para recipientes estacionários para decantação até 10 m³.
- e) As distâncias mínimas de segurança não se aplicam aos recipientes novos ou requalificados sem uso.
- 'Fonte indicada na página: ABNT NBR 15186.'
inconsistencias_da_fonte:
- O título diz "armazenamento de GNC", mas as linhas são de base de GLP (casa de bombas e compressores
  de GLP, envasamento, recipientes para decantação) e a fonte indicada é a ABNT NBR 15186 (bases de armazenamento
  de GLP).
- 'Pela observação a) a matriz deveria ser simétrica, mas não é: B×F = - e F×B = em branco.'
