notas:
- 'Afastamentos em metros (cabeçalho geral da tabela: "Afastamentos (m)").'
- 'Observações da tabela:'
- a) Esta tabela se aplica exclusivamente ao armazenamento de recipientes transportáveis, para substituição
  em empilhadeiras e outros veículos movidos a GLP, que atenda aos requisitos estabelecidos em 5.3.1.
- b) As distâncias de afastamento das edificações não consideram as projeções de complementos ou partes
  destas, como telhados, balcões, marquises, quando não constituírem áreas destinadas à ocupação ou estoque
  de materiais.
- c) Para os recipientes transportáveis instalados no interior de abrigos, com paredes e cobertura com
  TRRF mínimo de 02 (duas) horas, a distância para fontes de ignição e outras aberturas (portas, janelas,
  etc) pode ser reduzida à metade, nas direções protegidas pelas paredes dos abrigos.
- d) No caso de depósitos de oxigênio e hidrogênio, os afastamentos devem ser conforme as tabelas específicas
  da NT 3-02 Gás (GLP/GN) – Uso predial.
- e) Para captação de ar forçado acima das válvulas dos recipientes, o afastamento mínimo de segurança
  pode ser reduzido para 3 m.
- 'Fonte indicada na página: CBMERJ.'
