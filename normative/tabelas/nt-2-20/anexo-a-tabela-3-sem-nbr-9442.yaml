notas:
- 'Legenda da tabela:'
- FIGRA - Índice de taxa de desenvolvimento de calor.
- LFS - Propagação lateral da chama.
- SMOGRA - Taxa de desenvolvimento de fumaça, correspondendo ao máximo do quociente de produção de fumaça
  do corpo de prova e o tempo de sua ocorrência.
- tf - Tempo de flamejamento do corpo de prova.
- THR600s - Liberação total de calor do corpo de prova nos primeiros 600 s de exposição às chamas.
- TSP600s - Produção total da fumaça do corpo de prova nos primeiros 600 s de exposição às chamas.
- FS - Tempo em que a frente da chama leva para atingir a marca de 150 mm indicada na face do material
  ensaiado.
- Δm - Variação de massa do corpo de prova.
- ΔT - Variação de temperatura no interior do forno.
- 'Fonte indicada na página: ABNT NBR 15575:2013 - Edificações habitacionais – Desempenho.'
inconsistencias_da_fonte:
- Cabeçalho "EM ISO 11925-2" (a norma é EN ISO 11925-2, como na Tabela 1).
- A legenda define "LFS" e a tabela usa "LSF".
- Na classe III A os critérios de fumaça estão ligados por "ou" (SMOGRA ≤ 180 m²/s² ou TSP600s ≤ 200m²);
  nas classes II A, IV A e V A, por "e".
