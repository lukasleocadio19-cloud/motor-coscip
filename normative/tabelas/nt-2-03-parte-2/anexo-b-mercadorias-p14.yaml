notas:
- Cada registro da tabela é um bloco de linhas; aqui vai uma linha do bloco por linha, com a classe na
  linha em que a página a alinha.
- A primeira linha continua o registro "Sintéticos (exceto raiom e náilon) - mistura maior que 50/50"
  da página 13.
- 'FONTE: IT-24/2018 - CBPMESP.'
- 1. Produto em embalagem laminada com plástico em caixa de papelão corrugado. Se embalado em metal laminado,
  este pode ser considerado na Classe I;
- 2. A maioria das baterias tem gabinete de polipropileno. Se armazenadas vazias devem ser tratadas como
  plástico Grupo A. Baterias para caminhões, mesmo quando cheias, devem ser consideradas plástico Grupo
  A por causa das paredes mais espessas;
- 3. À medida que as aberturas em engradados plásticos aumentam, o produto comporta-se mais como Classe
  III. Da mesma maneira, à medida que as aberturas tornam-se menores, o produto comporta-se mais como
  plástico;
- 4. Estes itens devem ser tratados como paletes vazios;
- 5. Testes mostram claramente que um material sintético ou uma mistura com materiais sintéticos é considerado
  superior a Classe III;
- 6. Quando bebidas alcoólicas destiladas são armazenadas em recipientes de vidro em porta-paletes, estas
  devem ser consideradas Classe III; quando paletizadas, devem ser consideradas Classe IV.
