notas:
- 'Fonte indicada na página: R 105 – Exército Brasileiro.'
- 'Observações da tabela:'
- 1) a quantidade de 226.800 kg é a máxima permitida em um mesmo local;
- 2) a quantidade máxima permitida, em um mesmo local, de nitrato de amônio, grau agrícola, destinado
  à fabricação de fertilizantes, e as condições de armazenamento serão estabelecidas em legislação complementar.
inconsistencias_da_fonte:
- 'Faixas sobrepostas: a linha "9.001 a 18.100" é seguida por "18.001 a 31.750" (18.001 a 18.100 kg estão
  nas duas).'
- As distâncias diminuem de 115 m (45.351 a 90.700 kg) para 110 m (90.701 a 136.000 kg) em edificações
  habitadas, ferrovias e rodovias.
