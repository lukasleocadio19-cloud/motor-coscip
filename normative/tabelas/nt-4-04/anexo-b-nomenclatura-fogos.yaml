notas:
- 'Observações da tabela:'
- (a) Nome genérico, usual no Brasil, embora sem autopropulsão.
- (b) Conjunto integrado por tubo de lançamento e bomba aérea com carga de projeção, com diâmetro interno
  superior a 50 mm.
- 'Fonte indicada na página: REGT/02 – Exército Brasileiro.'
inconsistencias_da_fonte:
- '"crakling" em Foguete (em Bolas crepitantes a mesma palavra aparece como "crackling").'
