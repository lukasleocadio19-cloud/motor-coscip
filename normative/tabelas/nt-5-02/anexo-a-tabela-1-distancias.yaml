notas:
- 'Células da coluna "inclinado" de 9" a 16" em cinza (não se aplica) na página: em branco na tabela.'
- 'Obs. da tabela: Para aplicar as distâncias reduzidas indicadas na coluna "tubo de lançamento inclinado",
  os tubos de lançamento devem estar inclinados na direção oposta à área dos espectadores e a inclinação
  seguirá o previsto no REG/T 03 do Exército Brasileiro.'
