- 'Obs. 1 da tabela: O autor do plano de emergência deverá avaliar a necessidade de inclusão de outras
  simbologias não representadas nesta tabela, em função das peculiaridades da edificação e da inspeção
  realizada. Neste caso, as novas simbologias devem atender a coloração definida no item 5.2.6.15 desta
  NT.'
- 'Obs. 2 da tabela: Todas as simbologias utilizadas devem constar na legenda da planta de emergência.'
