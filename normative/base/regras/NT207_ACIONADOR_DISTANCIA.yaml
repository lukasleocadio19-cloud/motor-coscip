schema_version: rules/1.1
id: NT207_ACIONADOR_DISTANCIA
version: 1
title: Acionador manual a no máximo 30 m de percurso em cada pavimento
measure: Detecção e alarme
subject: FLOOR
publication_state: DRAFT
production_eligible: false
jurisdiction: CBMERJ-RJ
source:
  document: NT 2-07
  edition: 1ª edição - 2019
  item: 5.5.2
  quote: ["em cada pavimento da edificação", "distância máxima de 30 m", "acionador manual mais próximo"]
applies_when:
  any:
