  - {fact: quality.region_confirmed, operator: equals, value: true}
  - {fact: quality.manual_call_point.complete, operator: equals, value: true}
calculation:
  operator: maximum_with_uncertainty
  measured: floor.manual_call_point.max_travel_m
  required: {value: 30}
  unit: m
on_missing: MISSING_DATA
on_conflict: REVIEW_REQUIRED
