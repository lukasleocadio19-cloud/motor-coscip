# RASCUNHO redigido pelo assistente a partir do texto ingerido da NT 2-08. Sem homologação.
# O limite vem do Anexo C, que desde o pacote v5 é dado conferido (distancias-saida.yaml);
# nesta regra antiga o analista ainda informa o valor (context.exit_max_distance_m). Saídas vêm de marcações/placas e exigem confirmação.
schema_version: rules/1.1
id: NT208_SAIDA_DISTANCIA
version: 1
title: Distância máxima a percorrer até a saída
measure: Saídas de emergência
subject: FLOOR
publication_state: DRAFT
production_eligible: false
jurisdiction: CBMERJ-RJ
source:
  document: NT 2-08
  edition: 1ª edição - 2019; Portaria 1.317/2025
  item: 5.3.3.1
  quote: ["devem atender o Anexo C", "a partir do ponto mais distante"]
extra_sources:
  - document: NT 2-08
    edition: 1ª edição - 2019; Portaria 1.317/2025
    item: Anexo C
    quote: ["DISTÂNCIAS MÁXIMAS A SEREM PERCORRIDAS"]
applies_when:
  all:
    - {fact: context.unifamiliar, operator: equals, value: false}
required_inputs:
  - floor.exit.max_travel_m
  - context.exit_max_distance_m
  - context.exits_confirmed
  - quality.walls_detected
  - quality.region_confirmed
  - quality.exit.complete
quality_gates:
  - {fact: context.exits_confirmed, operator: equals, value: true}
  - {fact: quality.walls_detected, operator: equals, value: true}
  - {fact: quality.region_confirmed, operator: equals, value: true}
  - {fact: quality.exit.complete, operator: equals, value: true}
calculation:
  operator: maximum_with_uncertainty
  measured: floor.exit.max_travel_m
  required: context.exit_max_distance_m
  unit: m
on_missing: MISSING_DATA
on_conflict: REVIEW_REQUIRED
on_unknown_applicability: MISSING_DATA
evidence_required: [source_instance, measured_geometry, calculation_trace]
