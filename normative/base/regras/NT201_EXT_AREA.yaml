# RASCUNHO redigido pelo assistente a partir do texto ingerido da NT 2-01. Sem homologação.
# Conta cada símbolo de extintor reconhecido como UMA unidade extintora, SEM conferir a
# capacidade extintora (Tabelas 1 e 2 continuam como item não automatizado).
# v3 (plano de correção F4.2): sem a porta quality.walls_detected — contar por área não
# depende de parede (a área do pavimento já carrega a própria incerteza).
schema_version: rules/1.1
id: NT201_EXT_AREA
version: 3
title: Quantidade de extintores pela área máxima protegida por unidade
measure: Extintores
subject: FLOOR
publication_state: DRAFT
production_eligible: false
jurisdiction: CBMERJ-RJ
source:
  document: NT 2-01
  edition: 2ª edição - 2020
  item: Tabela 3
  quote: ["Área máxima protegida por 01 (uma) unidade extintora", "250 m", "150 m", "100 m"]
applies_when:
  all:
    - {fact: context.unifamiliar, operator: equals, value: false}
required_inputs:
  - quality.extinguisher.not_presumed
  - floor.count.extinguishers
  - floor.area_m2
  - context.risk_class
  - quality.region_confirmed
quality_gates:
  - {fact: quality.extinguisher.not_presumed, operator: equals, value: true}
  - {fact: quality.region_confirmed, operator: equals, value: true}
calculation:
  operator: minimum_with_uncertainty
  measured: floor.count.extinguishers
  required:
    ceil_div:
      numerator: floor.area_m2
      denominator:
        table:
          key: context.risk_class
          values: {PEQUENO: 250, MEDIO: 150, GRANDE: 100}
  unit: un
on_missing: MISSING_DATA
on_conflict: REVIEW_REQUIRED
on_unknown_applicability: REVIEW_REQUIRED
evidence_required: [source_instance, measured_geometry, calculation_trace]
