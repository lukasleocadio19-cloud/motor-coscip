# Controle de vigência da base normativa (plano de correção, F1.3).
# Mensal: baixa os PDFs oficiais do manifesto e compara o SHA-256. Se mudar, abre uma issue
# por documento. NUNCA altera o texto da base automaticamente.
name: Vigência das NTs

on:
  schedule:
    - cron: "17 9 3 * *"   # dia 3 de cada mês, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: |
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install -e . --no-deps
      - name: Conferir os PDFs oficiais
        run: python -m tools.normas.vigencia --saida vigencia.json
      - name: Resumo
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          rows = json.load(open("vigencia.json", encoding="utf-8"))
          print("| Documento | Estado | Detalhe |\n| --- | --- | --- |")
          for r in rows:
              print(f"| {r['documento']} | {r['estado']} | {r.get('erro') or r.get('sha256_atual', '')[:16]} |")
          PY
      - name: Abrir issue por documento que mudou
        uses: actions/github-script@v7
        with:
          script: |
            const rows = JSON.parse(require('fs').readFileSync('vigencia.json', 'utf8'));
            const open = await github.paginate(github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const r of rows.filter(r => r.estado === 'MUDOU')) {
              if (open.some(i => i.title === r.issue.titulo)) continue;
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: r.issue.titulo, body: r.issue.corpo, labels: ['vigencia'] });
            }
      - uses: actions/upload-artifact@v4
        with:
          name: vigencia
          path: vigencia.json
