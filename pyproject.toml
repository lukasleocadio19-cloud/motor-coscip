[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-coscip"
version = "0.1.0"
description = "Motor CAD/COSCIP local: DXF, geometria, regras e relatórios no computador do operador."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "ezdxf>=1.3",
  "shapely>=2.0",
  "numpy>=1.26",
  "scipy>=1.13",
  "networkx>=3.3",
  # segundo método de distância (Fast Marching, eikonal) para conferir o vetorial (F7.2)
  "scikit-fmm>=2024.5",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "keyring>=25.0",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11",
       # valida os achados do motor contra skills/_comum/achado.schema.json (F8)
       "jsonschema>=4.23"]
# ferramentas da base normativa (F2): renderizar páginas e extrair tabelas dos PDFs oficiais
normas = ["pypdfium2>=4.30", "pdfplumber>=0.11", "rapidfuzz>=3.9", "pillow>=10.4"]
# PDF das folhas (exportar_pdf do MCP, frente D3): renderiza cada vista na sua escala
pdf = ["pymupdf>=1.24"]

[project.scripts]
coscip-launcher = "coscip_api.launcher:main"
coscip-worker = "coscip_worker.main:main"
coscip-mcp = "coscip_mcp.server:main"

[tool.setuptools.packages.find]
where = [
  "apps/api",
  "apps/mcp",
  "workers/local",
  "packages/cbm_schema",
  "packages/cad",
  "packages/geometry",
  "packages/topology",
  "packages/semantics",
  "packages/rules",
  "packages/storage",
  "packages/jobs",
  "packages/ai_gateway",
  "packages/normative",
  "packages/analysis",
  "packages/design",
]
include = ["coscip_*"]

[tool.setuptools.package-data]
# desenhos oficiais das NTs, vetorizados dos PDFs (tools/normas/extrair_simbolos.py)
coscip_mcp = ["simbolos_nt.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "timeout: limite de tempo (informativo)",
  "windows: depende do Windows (os.kill, keyring, PowerShell); pulado nos outros sistemas",
]
pythonpath = [
  ".", "apps/api", "apps/mcp", "workers/local", "packages/cbm_schema", "packages/cad",
  "packages/geometry", "packages/topology", "packages/semantics",
  "packages/rules", "packages/storage", "packages/jobs", "packages/ai_gateway",
  "packages/normative", "packages/analysis", "packages/design",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# .claude/skills*: skills de terceiros (docs/skills-externas.md), não são código do projeto
extend-exclude = ["apps/api/coscip_api/migrations/versions", "node_modules",
                  ".claude/skills", ".claude/skills-inativas"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
  "coscip_api", "coscip_worker", "coscip_cbm", "coscip_cad", "coscip_geometry",
  "coscip_topology", "coscip_semantics", "coscip_rules", "coscip_storage", "coscip_jobs",
  "coscip_ai", "coscip_normative", "coscip_analysis", "coscip_mcp", "tests", "tools",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File"]
